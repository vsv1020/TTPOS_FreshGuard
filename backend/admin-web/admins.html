<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshGuard Admin - Admins</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <h1>FreshGuard Admin</h1>
      <nav class="topnav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/binding">Binding</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/report">Report</a>
        <a href="/admin/waste">Waste</a>
        <a href="/admin/compliance">Compliance</a>
        <a href="/admin/audit-logs">Audit</a>
        <a class="active" href="/admin/admins" data-nav="admins" hidden>Admins</a>
      </nav>
      <button id="logout-btn" type="button">Log Out</button>
    </header>

    <main class="dashboard-grid">
      <section class="panel" data-write>
        <h2>Create Admin</h2>
        <form id="admin-form" class="stack">
          <input id="admin-email" type="email" placeholder="Email" required />
          <input id="admin-password" type="password" placeholder="Password" required minlength="8" autocomplete="new-password" />
          <select id="admin-role" required>
            <option value="platform_admin">platform_admin</option>
            <option value="brand_admin">brand_admin</option>
            <option value="viewer">viewer</option>
          </select>
          <select id="admin-brand">
            <option value="">No brand (platform-wide)</option>
          </select>
          <p class="hint">brand_admin requires a brand; viewer is read-only.</p>
          <button type="submit">Create Admin</button>
        </form>
      </section>

      <section class="panel wide">
        <h2>Admins</h2>
        <div id="admins-controls"></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Role</th>
              <th>Brand</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="admins-table"></tbody>
        </table>
      </section>
    </main>

    <!-- Edit Admin Modal -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center;">
      <div class="card" style="width:min(480px,94vw);max-height:90vh;overflow-y:auto;">
        <h2>Edit Admin</h2>
        <form id="edit-admin-form" class="stack">
          <input type="hidden" id="edit-admin-id" />
          <p class="hint" id="edit-admin-email"></p>
          <select id="edit-admin-role" required>
            <option value="platform_admin">platform_admin</option>
            <option value="brand_admin">brand_admin</option>
            <option value="viewer">viewer</option>
          </select>
          <select id="edit-admin-brand">
            <option value="">No brand (platform-wide)</option>
          </select>
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
            <input id="edit-admin-disabled" type="checkbox" style="width:auto;" /> Disabled
          </label>
          <div style="display:flex;gap:8px;">
            <button type="submit" style="flex:1;">Save Changes</button>
            <button type="button" id="edit-cancel-btn" style="flex:1;background:#64748b;">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <p id="page-message" class="page-message"></p>

    <script src="/admin/assets/common.js"></script>
    <script src="/admin/assets/admins.js"></script>
  </body>
</html>
