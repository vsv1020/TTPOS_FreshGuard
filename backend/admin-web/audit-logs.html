<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.audit">FreshGuard Admin - Audit Logs</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <h1 data-i18n="app.title">FreshGuard Admin</h1>
      <nav class="topnav">
        <a data-i18n="nav.dashboard" href="/admin/dashboard">Dashboard</a>
        <a data-i18n="nav.binding" href="/admin/binding">Binding</a>
        <a data-i18n="nav.products" href="/admin/products">Products</a>
        <a data-i18n="nav.staff" href="/admin/staff">Staff</a>
        <a data-i18n="nav.labelTemplates" href="/admin/label-templates">Label Templates</a>
        <a data-i18n="nav.report" href="/admin/report">Report</a>
        <a data-i18n="nav.waste" href="/admin/waste">Waste</a>
        <a data-i18n="nav.compliance" href="/admin/compliance">Compliance</a>
        <a data-i18n="nav.audit" href="/admin/audit-logs">Audit</a>
        <a data-i18n="nav.admins" href="/admin/admins" data-nav="admins" hidden>Admins</a>
      </nav>
      <button id="logout-btn" type="button" data-i18n="common.logout">Log Out</button>
    </header>

    <main class="dashboard-grid">
      <section class="panel wide">
        <h2 data-i18n="audit.title">Audit Logs</h2>
        <form id="audit-filter-form" class="filter-row">
          <input id="audit-actor" placeholder="Actor (email / staff id)" data-i18n-ph="audit.phActor" />
          <select id="audit-action">
            <option value="" data-i18n="audit.allActions">All actions</option>
          </select>
          <input id="audit-from" type="date" title="From date" data-i18n-title="audit.fromDate" />
          <input id="audit-to" type="date" title="To date" data-i18n-title="audit.toDate" />
          <button type="submit" data-i18n="audit.applyFilters">Apply Filters</button>
        </form>
        <div id="audit-controls"></div>
        <table>
          <thead>
            <tr>
              <th data-i18n="audit.thTime">Time</th>
              <th data-i18n="audit.thActorType">Actor Type</th>
              <th data-i18n="audit.thActor">Actor</th>
              <th data-i18n="audit.thAction">Action</th>
              <th data-i18n="audit.thTarget">Target</th>
              <th data-i18n="audit.thDetail">Detail</th>
              <th data-i18n="audit.thIp">IP</th>
            </tr>
          </thead>
          <tbody id="audit-table"></tbody>
        </table>
      </section>
    </main>

    <p id="page-message" class="page-message"></p>

    <script src="/admin/assets/i18n.js"></script>
    <script src="/admin/assets/common.js"></script>
    <script src="/admin/assets/audit-logs.js"></script>
  </body>
</html>
