<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshGuard Admin Dashboard</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
    <style>
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
        margin: 18px 18px 0;
      }

      .kpi-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.08);
        padding: 18px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .kpi-label {
        font-size: 0.82rem;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .kpi-value {
        font-size: 2rem;
        font-weight: 800;
        color: #0f172a;
        line-height: 1;
      }

      .kpi-card.warn .kpi-value { color: #b45309; }
      .kpi-card.danger .kpi-value { color: #b91c1c; }
      .kpi-card.good .kpi-value { color: #15803d; }

      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 16px;
        padding: 16px 18px 18px;
      }

      .chart-panel {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.08);
        padding: 16px;
      }

      .chart-panel h2 {
        margin: 0 0 14px;
        font-size: 1rem;
        color: #0f172a;
      }

      .chart-container {
        position: relative;
        height: 220px;
      }

      .loading-text {
        color: #94a3b8;
        font-size: 0.9rem;
        padding: 8px 0;
      }

      /* P2-5: drill-down filters + store ranking table */
      .dash-filters {
        margin: 18px 18px 0;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.08);
        padding: 12px 16px;
      }

      .dash-filters .filter-row {
        margin: 0;
      }

      .table-panel {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.08);
        padding: 16px;
        margin: 0 18px 18px;
      }

      .table-panel h2 {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #0f172a;
      }

      .table-panel th.sortable {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .table-panel th.sortable:hover {
        color: #0369a1;
      }

      td.bad {
        color: #b91c1c;
        font-weight: 700;
        background: #fef2f2;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <h1>FreshGuard Admin</h1>
      <nav class="topnav">
        <a class="active" href="/admin/dashboard">Dashboard</a>
        <a href="/admin/binding">Binding</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/staff">Staff</a>
        <a href="/admin/label-templates">Label Templates</a>
        <a href="/admin/report">Report</a>
        <a href="/admin/waste">Waste</a>
        <a href="/admin/compliance">Compliance</a>
        <a href="/admin/audit-logs">Audit</a>
        <a href="/admin/admins" data-nav="admins" hidden>Admins</a>
      </nav>
      <button id="logout-btn" type="button">Log Out</button>
    </header>

    <!-- P2-5: date range + brand/store drill-down filters -->
    <div class="dash-filters">
      <div class="filter-row">
        <label for="dash-from">From</label>
        <input id="dash-from" type="date" />
        <label for="dash-to">To</label>
        <input id="dash-to" type="date" />
        <label for="dash-brand">Brand</label>
        <select id="dash-brand"></select>
        <label for="dash-store">Store</label>
        <select id="dash-store"></select>
        <button id="dash-refresh" type="button">Refresh</button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-label">今日到期</span>
        <span class="kpi-value loading-text" id="kpi-today">—</span>
      </div>
      <div class="kpi-card danger" id="kpi-card-unhandled">
        <span class="kpi-label">未处置过期</span>
        <span class="kpi-value loading-text" id="kpi-unhandled">—</span>
      </div>
      <div class="kpi-card" id="kpi-card-rate">
        <span class="kpi-label">近30天处置率</span>
        <span class="kpi-value loading-text" id="kpi-rate">—</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">门店数</span>
        <span class="kpi-value loading-text" id="kpi-stores">—</span>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-panel">
        <h2>门店未处置到期品排行</h2>
        <div class="chart-container">
          <canvas id="chart-ranking"></canvas>
        </div>
      </div>

      <div class="chart-panel">
        <h2>近30天损耗趋势</h2>
        <div class="chart-container">
          <canvas id="chart-loss"></canvas>
        </div>
      </div>

      <div class="chart-panel">
        <h2>巡检平均分趋势</h2>
        <div class="chart-container">
          <canvas id="chart-score"></canvas>
        </div>
      </div>
    </div>

    <!-- P2-5: store ranking table -->
    <div class="table-panel">
      <h2>门店排名</h2>
      <p class="hint">点击列标题排序。红色单元格表示该项需要关注（处理率 &lt; 80%、损耗率 &gt; 10%、巡检均分 &lt; 60、存在未关闭/逾期问题）。</p>
      <table>
        <thead>
          <tr id="ranking-head">
            <th class="sortable" data-key="storeName">门店</th>
            <th class="sortable" data-key="handleRate">处理率</th>
            <th class="sortable" data-key="wasteRate">损耗率</th>
            <th class="sortable" data-key="avgInspectionScore">巡检均分</th>
            <th class="sortable" data-key="openIssues">未关闭问题</th>
            <th class="sortable" data-key="overdueIssues">逾期问题</th>
          </tr>
        </thead>
        <tbody id="store-ranking-table"></tbody>
      </table>
    </div>

    <script src="/admin/assets/vendor/chart.umd.min.js"></script>
    <script src="/admin/assets/common.js"></script>
    <script src="/admin/assets/dashboard.js"></script>
  </body>
</html>
