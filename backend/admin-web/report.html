<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.report">FreshGuard Admin - Expired Report</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <h1 data-i18n="app.title">FreshGuard Admin</h1>
      <nav class="topnav">
        <a data-i18n="nav.dashboard" href="/admin/dashboard">Dashboard</a>
        <a data-i18n="nav.binding" href="/admin/binding">Binding</a>
        <a data-i18n="nav.products" href="/admin/products">Products</a>
        <a data-i18n="nav.staff" href="/admin/staff">Staff</a>
        <a data-i18n="nav.labelTemplates" href="/admin/label-templates">Label Templates</a>
        <a data-i18n="nav.report" href="/admin/report">Report</a>
        <a data-i18n="nav.waste" href="/admin/waste">Waste</a>
        <a data-i18n="nav.compliance" href="/admin/compliance">Compliance</a>
        <a data-i18n="nav.audit" href="/admin/audit-logs">Audit</a>
        <a data-i18n="nav.admins" href="/admin/admins" data-nav="admins" hidden>Admins</a>
      </nav>
      <button id="logout-btn" type="button" data-i18n="common.logout">Log Out</button>
    </header>

    <main class="dashboard-grid">
      <section class="panel wide">
        <h2>Unhandled Expired by Store -> Product</h2>
        <p class="hint">Rows are grouped by store and product. Unhandled expired count is the key metric for follow-up.</p>
        <div class="filter-row">
          <button id="refresh-report" type="button">Refresh</button>
          <button id="export-csv-btn" type="button" style="background:#0369a1;">Export CSV</button>
        </div>
        <div id="report-controls"></div>
        <table>
          <thead>
            <tr>
              <th>Store</th>
              <th>Product</th>
              <th>Unhandled Expired</th>
              <th>Expired Total</th>
              <th>Handled</th>
            </tr>
          </thead>
          <tbody id="report-table"></tbody>
        </table>
      </section>
    </main>

    <p id="page-message" class="page-message"></p>

    <script src="/admin/assets/i18n.js"></script>
    <script src="/admin/assets/common.js"></script>
    <script src="/admin/assets/report.js"></script>
  </body>
</html>
