<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.staff">FreshGuard Admin - Staff</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <h1 data-i18n="app.title">FreshGuard Admin</h1>
      <nav class="topnav">
        <a data-i18n="nav.dashboard" href="/admin/dashboard">Dashboard</a>
        <a data-i18n="nav.binding" href="/admin/binding">Binding</a>
        <a data-i18n="nav.products" href="/admin/products">Products</a>
        <a data-i18n="nav.staff" href="/admin/staff">Staff</a>
        <a data-i18n="nav.labelTemplates" href="/admin/label-templates">Label Templates</a>
        <a data-i18n="nav.report" href="/admin/report">Report</a>
        <a data-i18n="nav.waste" href="/admin/waste">Waste</a>
        <a data-i18n="nav.compliance" href="/admin/compliance">Compliance</a>
        <a data-i18n="nav.audit" href="/admin/audit-logs">Audit</a>
        <a data-i18n="nav.erpSync" href="/admin/erp-sync">ERP</a>
        <a data-i18n="nav.admins" href="/admin/admins" data-nav="admins" hidden>Admins</a>
      </nav>
      <button id="logout-btn" type="button" data-i18n="common.logout">Log Out</button>
    </header>

    <main class="dashboard-grid">
      <section class="panel">
        <h2 data-i18n="staff.selectStore">Select Store</h2>
        <select id="store-select"></select>
      </section>

      <section class="panel" data-write>
        <h2 data-i18n="staff.addStaff">Add Staff</h2>
        <form id="staff-form" class="stack">
          <input id="staff-name" data-i18n-ph="staff.namePh" placeholder="Staff name" required />
          <input id="staff-pin" data-i18n-ph="staff.pinPh" placeholder="PIN" required />
          <select id="staff-role">
            <option value="staff" data-i18n="staff.roleStaff">staff</option>
            <option value="manager" data-i18n="staff.roleManager">manager</option>
          </select>
          <button type="submit" data-i18n="staff.addStaffBtn">Add Staff</button>
        </form>
      </section>

      <section class="panel wide">
        <h2 data-i18n="staff.listTitle">Staff</h2>
        <table>
          <thead>
            <tr>
              <th data-i18n="staff.thId">ID</th>
              <th data-i18n="staff.thName">Name</th>
              <th data-i18n="staff.thRole">Role</th>
              <th data-i18n="staff.thActive">Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="staff-table"></tbody>
        </table>
      </section>
    </main>

    <!-- Edit Staff Modal -->
    <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center;">
      <div class="card" style="width:min(420px,94vw);max-height:90vh;overflow-y:auto;">
        <h2 data-i18n="staff.editStaff">Edit Staff</h2>
        <form id="edit-staff-form" class="stack">
          <input type="hidden" id="edit-staff-id" />
          <input id="edit-staff-name" data-i18n-ph="staff.namePh" placeholder="Staff name" required />
          <input id="edit-staff-pin" data-i18n-ph="staff.newPinPh" placeholder="New PIN (leave blank to keep)" />
          <select id="edit-staff-role">
            <option value="staff" data-i18n="staff.roleStaff">staff</option>
            <option value="manager" data-i18n="staff.roleManager">manager</option>
          </select>
          <label style="display:flex;align-items:center;gap:8px;font-weight:600;">
            <input type="checkbox" id="edit-staff-active" style="width:auto;padding:0;border:none;" />
            <span data-i18n="staff.active">Active</span>
          </label>
          <div style="display:flex;gap:8px;">
            <button type="submit" style="flex:1;" data-i18n="staff.saveChanges">Save Changes</button>
            <button type="button" id="edit-cancel-btn" style="flex:1;background:#64748b;" data-i18n="staff.cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <p id="page-message" class="page-message"></p>

    <script src="/admin/assets/i18n.js"></script>
    <script src="/admin/assets/common.js"></script>
    <script src="/admin/assets/staff.js"></script>
  </body>
</html>
